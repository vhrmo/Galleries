    <img alt="Test gallery" src="./img/P1087318.jpeg">
</div>


<script type="module" src="../res/page-init-photoswipe.js"></script>
<script type="module">
    const stackParams = [
        {rotate: 2, top: 90, zIndex: 190},
        {rotate: -3, top: 40, zIndex: 100},
        {rotate: -6, top: 130, zIndex: 180},
        {rotate: 4, top: 110, zIndex: 140},
        {rotate: -6, top: 60, zIndex: 140},
        {rotate: 4, top: 90, zIndex: 140},
        {rotate: -4, top: 120, zIndex: 140},
        {rotate: 2, top: 50, zIndex: 140},
        {rotate: -4, top: 130, zIndex: 200},

        // {rotate: -2, top: 50, zIndex: 140},
    ];

    function getOffsetX(container, images) {
        const containerWidth = container.clientWidth;
        const offsetX = Math.floor((containerWidth - 220)/images.length);
        return Math.min(offsetX, 200);
    }

    function init(container) {
        const images = Array.from(container.querySelectorAll('img'));
        if (images.length === 0) return;
        const offsetX =getOffsetX(container, images);
        for (let i = 0; i < images.length; i++) {
            const img = images[i];
            // img.style.backgroundColor = 'green';
            img.style.position = 'absolute';

            img.naturalWidth > img.naturalHeight
                ? img.style.maxHeight = '200px'
                : img.style.maxHeight = '250px';

            const params = stackParams[i % stackParams.length];
            const offset = Math.floor(i / stackParams.length) * 300;
            img.style.top = params.top + 'px';
            // img.style.left = (params.left + offset) + 'px';
            img.style.left = (offsetX * i) + 'px';
            img.style.transform = 'rotate(' + params.rotate + 'deg)';
            img.style.zIndex = params.zIndex;
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.gallery.photo-stack').forEach(gallery => {
            init(gallery);
        })
    })
    window.addEventListener('resize', () => {
        document.querySelectorAll('.gallery.photo-stack').forEach(container => {
            const images = Array.from(container.querySelectorAll('img'));
            const offsetX = getOffsetX(container, images);
            for (let i = 0; i < images.length; i++) {
                const img = images[i];
                img.style.left = (offsetX * i) + 'px';
            }
        })
    });

</script>
