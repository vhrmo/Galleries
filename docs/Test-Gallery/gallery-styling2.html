<!DOCTYPE html>

<head>
    <title>Test Gallery - PhotoSwipe</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer"/>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px 10%;
        }

        @media (max-width: 1000px) {
            body {
                margin: 20px 10px;
            }
        }

        .gallery.photo-stack {
            position: relative;
            height: 400px;
            /*overflow: hidden;*/
        }

        .gallery.photo-stack img {
            max-width: 250px;
            max-height: 240px;
            position: absolute;
            background-color: whitesmoke;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: all 0.5s;
        }

        .gallery.photo-stack img.hovered {
            z-index: 500 !important;
            /*background-color: green;*/
            transform: scale(1.2) !important;
            /*scale: 1.2 !important;*/
            transition: all 0.5s;
        }

        .gallery.photo-stack img:nth-child(9n+1) { transform: rotate(2deg);  left:20px; top: 90px;  z-index: 190 }
        .gallery.photo-stack img:nth-child(9n+2) { transform: rotate(-3deg); left:20px; top: 40px;  z-index: 100 }
        .gallery.photo-stack img:nth-child(9n+3) { transform: rotate(-6deg); left:20px; top: 130px; z-index: 180 }
        .gallery.photo-stack img:nth-child(9n+4) { transform: rotate(4deg);  left:20px; top: 110px; z-index: 140 }
        .gallery.photo-stack img:nth-child(9n+5) { transform: rotate(-6deg); left:20px; top: 60px;  z-index: 140 }
        .gallery.photo-stack img:nth-child(9n+6) { transform: rotate(4deg);  left:20px; top: 90px;  z-index: 140 }
        .gallery.photo-stack img:nth-child(9n+7) { transform: rotate(-4deg); left:20px; top: 120px; z-index: 140 }
        .gallery.photo-stack img:nth-child(9n+8) { transform: rotate(2deg);  left:20px; top: 50px;  z-index: 140 }
        .gallery.photo-stack img:nth-child(9n) { transform: rotate(-4deg);   left:20px; top: 130px; z-index: 200 }

    </style>

</head>

<h2>Sample Gallery</h2>
<div class="gallery photo-stack">
    <img alt="Test gallery" src="./img/P1087298.jpeg">
    <img alt="Test gallery" src="./img/P1087318.jpeg">
</div>


<script type="module" src="../res/page-init-photoswipe.js"></script>
<script type="module">

    function getOffsetX(container, images) {
        const containerWidth = container.clientWidth;
        const offsetX = Math.floor((containerWidth - 220)/images.length);
        return Math.min(offsetX, 200);
    }

    function layoutPhotos(container) {
        const images = Array.from(container.querySelectorAll('img'));
        if (images.length === 0) return;
        const offsetX =getOffsetX(container, images);
        for (let i = 0; i < images.length; i++) {
            const img = images[i];
            img.style.left = (offsetX * i) + 'px';

            const initialized = img.dataset.initialized;
            if (!initialized) {
                img.addEventListener('mouseenter', (e) => {
                    images.forEach(im => im.classList.remove('hovered'));
                    img.classList.add('hovered');
                });
                img.dataset.initialized = 'true';
            }
        }
    }

    function layoutPhotoGalleries() {
        document.querySelectorAll('.gallery.photo-stack').forEach(container => {
            layoutPhotos(container);
        })
    }

    document.addEventListener('DOMContentLoaded', layoutPhotoGalleries);
    window.addEventListener('resize', layoutPhotoGalleries);

</script>
</body>
