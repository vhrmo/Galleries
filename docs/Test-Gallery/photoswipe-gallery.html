<!DOCTYPE html>
<html lang="sk">
<head>
    <title>Test Gallery - PhotoSwipe</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer"/>

    <link rel="stylesheet" type="text/css" href="../res/photoswipe/photoswipe.css" />

</head>
<body>
<h1>Test Gallery - PhotoSwipe</h1>

<div class="pswp-gallery pswp-gallery--single-column gallery" id="gallery--getting-started">
    <a href="https://cdn.photoswipe.com/photoswipe-demo-images/photos/2/img-2500.jpg"
       data-pswp-width="1669"
       data-pswp-height="2500"
       target="_blank">
        <img src="https://cdn.photoswipe.com/photoswipe-demo-images/photos/2/img-200.jpg" alt="" />
    </a>
    <!-- cropped thumbnail: -->
    <a href="https://cdn.photoswipe.com/photoswipe-demo-images/photos/7/img-2500.jpg"
       data-pswp-width="1875"
       data-pswp-height="2500"
       data-cropped="true"
       target="_blank">
        <img src="https://cdn.photoswipe.com/photoswipe-demo-images/photos/7/img-200.jpg" alt="" />
        Cropped
    </a>
    <!-- data-pswp-src with custom URL in href -->
    <a href="https://unsplash.com"
       data-pswp-src="https://cdn.photoswipe.com/photoswipe-demo-images/photos/3/img-2500.jpg"
       data-pswp-width="2500"
       data-pswp-height="1666"
       target="_blank">
        <img src="https://cdn.photoswipe.com/photoswipe-demo-images/photos/3/img-200.jpg" alt="" />
    </a>
    <!-- Without thumbnail: -->
    <a href="http://example.com"
       data-pswp-src="https://cdn.photoswipe.com/photoswipe-demo-images/photos/5/img-2500.jpg"
       data-pswp-width="2500"
       data-pswp-height="1668"
       target="_blank">
        No thumbnail
    </a>
    <!-- wrapped with any element: -->
    <div>
        <a href="https://cdn.photoswipe.com/photoswipe-demo-images/photos/6/img-2500.jpg"
           data-pswp-width="2500"
           data-pswp-height="1667"
           target="_blank">
            <img src="https://cdn.photoswipe.com/photoswipe-demo-images/photos/6/img-200.jpg" alt="" />
        </a>
    </div>
</div>

<h2>Sample Gallery</h2>
<div id="gallery" class="gallery">
    <img alt="Test gallery" src="./img/P1087298.jpeg">
    <img alt="Test gallery" src="./img/P1087318.jpeg">
    <img alt="Test gallery.jpg" src="./img/kosutka_mapa.jpg">
    <img alt="Test gallery" src="./img/hes_kosutka_1747.jpeg">
    <img alt="Test gallery" src="./img/hes_kosutka_1753.jpeg">
    <img alt="Test gallery" src="./img/hes_kosutka_2481.jpeg">
    <img alt="Test gallery" src="./img/hes_kosutka_4026.jpeg">
</div>

<style>
    #gallery img {
        max-width: 300px;
        max-height: 200px;
    }
</style>

<script type="module">
    import PhotoSwipeLightbox from '../res/photoswipe/photoswipe-lightbox.esm.js';
    import PhotoSwipe from '../res/photoswipe/photoswipe.esm.js';

    document.addEventListener('DOMContentLoaded', function () {
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#gallery--getting-started',
            children: 'a',
            pswpModule: PhotoSwipe
        });
        lightbox.init();

        const lightbox2 = new PhotoSwipeLightbox({
            gallery: '#gallery',
            children: 'img',
            pswpModule: PhotoSwipe
        });

        lightbox2.addFilter('domItemData', (itemData, element, linkEl) => {
            if (element) {
                itemData.src = element.src;
                itemData.w = element.width * 10;
                itemData.h = element.height * 10;
                itemData.msrc = element.src;
            }
            return itemData;
        });
        lightbox2.init();
    });
</script>

</body>
</html>
